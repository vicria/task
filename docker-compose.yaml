version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task
      POSTGRES_SCHEMA: public
      STOP_ON_MIGRATION_FAILURE: "false"
    volumes:
      - db-data:/var/lib/postgresql

volumes:
  db-data:
    external: false
